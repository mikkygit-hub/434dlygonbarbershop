<!-- Scroll-triggered fade-in script -->
<script>
  const images = document.querySelectorAll('.fade-in-image');

  const observer = new IntersectionObserver((entries) => {
    entries.forEach(entry => {
      if (entry.isIntersecting) {
        entry.target.classList.add('visible');
      }
    });
  }, {
    threshold: 0.1
  });

  images.forEach(img => {
    observer.observe(img);
  });
</script>

<script>
  const canvas = document.getElementById("backgroundCanvas");
  const ctx = canvas.getContext("2d");

  canvas.width = window.innerWidth;
  canvas.height = window.innerHeight;

  const colors = ["#e60000", "#ffffff", "#0066cc"];
  const lines = [];

  for (let i = 0; i < 60; i++) {
    lines.push({
      x: Math.random() < 0.5 ? 0 : canvas.width,
      y: Math.random() * canvas.height,
      speed: 0.5 + Math.random(),
      color: colors[i % colors.length],
      width: 2 + Math.random() * 2,
      direction: Math.random() < 0.5 ? 1 : -1,
    });
  }

  function animateLines() {
    ctx.clearRect(0, 0, canvas.width, canvas.height);

    lines.forEach(line => {
      ctx.beginPath();
      ctx.strokeStyle = line.color;
      ctx.lineWidth = line.width;

      ctx.moveTo(line.x, line.y);
      ctx.lineTo(line.x + (line.direction * 30), line.y + 100);

      ctx.stroke();

      line.y += line.speed;

      if (line.y > canvas.height) {
        line.y = -100;
        line.x = Math.random() < 0.5 ? 0 : canvas.width;
      }
    });

    requestAnimationFrame(animateLines);
  }

  animateLines();

  window.addEventListener("resize", () => {
    canvas.width = window.innerWidth;
    canvas.height = window.innerHeight;
  });
</script>

<script>
  const galleryNavLinks = document.querySelectorAll('.hero-nav a');
  const activeGalleryLink = document.querySelector('.hero-nav a.active');

  function centerActiveGalleryNavLink() {
    if (activeGalleryLink && window.innerWidth <= 768) {
      activeGalleryLink.scrollIntoView({
        behavior: 'auto',
        inline: 'center',
        block: 'nearest'
      });
    }
  }

  galleryNavLinks.forEach(link => {
    link.addEventListener('click', function () {
      if (window.innerWidth <= 768) {
        this.scrollIntoView({
          behavior: 'smooth',
          inline: 'center',
          block: 'nearest'
        });
      }
    });
  });

  window.addEventListener('load', centerActiveGalleryNavLink);
  window.addEventListener('resize', centerActiveGalleryNavLink);
</script>
