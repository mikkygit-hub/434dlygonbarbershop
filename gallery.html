<!-- Scroll-triggered fade-in script -->
<script>
  const images = document.querySelectorAll('.fade-in-image');

  const observer = new IntersectionObserver((entries) => {
    entries.forEach(entry => {
      if (entry.isIntersecting) {
        entry.target.classList.add('visible');
      }
    });
  }, {
    threshold: 0.1
  });

  images.forEach(img => {
    observer.observe(img);
  });
</script>

<script>
  const canvas = document.getElementById("backgroundCanvas");
  const ctx = canvas.getContext("2d");

  canvas.width = window.innerWidth;
  canvas.height = window.innerHeight;

  const colors = ["#e60000", "#ffffff", "#0066cc"];
  const lines = [];

  for (let i = 0; i < 60; i++) {
    lines.push({
      x: Math.random() < 0.5 ? 0 : canvas.width,
      y: Math.random() * canvas.height,
      speed: 0.5 + Math.random(),
      color: colors[i % colors.length],
      width: 2 + Math.random() * 2,
      direction: Math.random() < 0.5 ? 1 : -1,
    });
  }

  function animateLines() {
    ctx.clearRect(0, 0, canvas.width, canvas.height);

    lines.forEach(line => {
      ctx.beginPath();
      ctx.strokeStyle = line.color;
      ctx.lineWidth = line.width;

      ctx.moveTo(line.x, line.y);
      ctx.lineTo(line.x + (line.direction * 30), line.y + 100);

      ctx.stroke();

      line.y += line.speed;

      if (line.y > canvas.height) {
        line.y = -100;
        line.x = Math.random() < 0.5 ? 0 : canvas.width;
      }
    });

    requestAnimationFrame(animateLines);
  }

  animateLines();

  window.addEventListener("resize", () => {
    canvas.width = window.innerWidth;
    canvas.height = window.innerHeight;
  });
</script>

<script>
  const lightbox = document.getElementById('lightbox');
  const lightboxImg = document.getElementById('lightbox-img');
  const image = document.querySelectorAll('.gallery-grid img');
  const closeBtn = document.querySelector('.lightbox-close');

  let currentIndex = 0;

  function showImage(index) {
    currentIndex = index;
    lightbox.style.display = 'flex';
    lightboxImg.src = images[currentIndex].src;
  }

  function nextImage() {
    currentIndex = (currentIndex + 1) % images.length;
    lightboxImg.src = images[currentIndex].src;
  }

  function prevImage() {
    currentIndex = (currentIndex - 1 + images.length) % images.length;
    lightboxImg.src = images[currentIndex].src;
  }

  images.forEach((img, index) => {
    img.addEventListener('click', () => {
      showImage(index);
    });
  });

  closeBtn.addEventListener('click', () => {
    lightbox.style.display = 'none';
    lightboxImg.src = '';
  });

  lightbox.addEventListener('click', (e) => {
    if (e.target === lightbox) {
      lightbox.style.display = 'none';
      lightboxImg.src = '';
    }
  });

  document.addEventListener('keydown', (e) => {
    if (lightbox.style.display === 'flex') {
      if (e.key === 'ArrowRight') nextImage();
      if (e.key === 'ArrowLeft') prevImage();
      if (e.key === 'Escape') {
        lightbox.style.display = 'none';
        lightboxImg.src = '';
      }
    }
  });

  let touchStartX = 0;

  lightbox.addEventListener('touchstart', (e) => {
    touchStartX = e.changedTouches[0].screenX;
  });

  lightbox.addEventListener('touchend', (e) => {
    const touchEndX = e.changedTouches[0].screenX;

    if (touchStartX - touchEndX > 50) {
      nextImage();
    }

    if (touchEndX - touchStartX > 50) {
      prevImage();
    }
  });
</script>
